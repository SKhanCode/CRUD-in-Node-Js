<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Project</title>
    <link rel="stylesheet" href="addproject.css">
</head>
<body>

    <div class="form-container">
        <button id="backBtn" class="btn-back">← Back to Dashboard</button>

        <h2>Add New Project</h2>

        <div class="input-group">
            <label>Project Name:</label>
            <input type="text" id="projectName" placeholder="e.g., Student Management System">
        </div>

        <div class="input-group">
            <label>Technologies Used:</label>
            <input type="text" id="projectTech" placeholder="e.g., C#, ASP.NET MVC, SQL Server">
        </div>

        <div class="input-group">
            <label>GitHub Repository Link:</label>
            <input type="url" id="githubLink" placeholder="https://github.com/yourusername/project-name">
        </div>

        <div class="input-group">
            <label>Project Status:</label>
            <select id="projectStatus">
                <option value="Active">Active</option>
                <option value="Completed">Completed</option>
                <option value="On Hold">On Hold</option>
            </select>
        </div>

        <button id="saveBtn" class="btn-save">Save Project</button>
    </div>

    <script src="addproject.js"></script>
</body>
</html>
